<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Marty Pricing Agent · Functional Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{wmblue:'#0053e2',spark:'#ffc220',wmred:'#ea1100',wmgreen:'#2a8703',marty:'#7c3aed',ink:'#1f2937'}}}}
  </script>
  <style>
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fb;color:#1f2937}.grad{background:linear-gradient(135deg,#6d28d9,#a855f7)}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.pill{font-size:10px;font-weight:800;border-radius:999px;padding:3px 8px}.low{background:#e8f7e3;color:#2a8703}.medium{background:#fff6d6;color:#995213}.high{background:#fee2e2;color:#b91c1c}.btn{border-radius:12px;padding:9px 13px;font-size:13px;font-weight:800}.btnp{background:#0053e2;color:white}.btns{background:white;border:1px solid #d1d5db;color:#374151}.btnd{background:#ea1100;color:white}.nav.active{background:#eef4ff;color:#0053e2;font-weight:800}.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</head>
<body>
  <div class="min-h-screen flex">
    <aside class="w-64 bg-white border-r border-gray-200 fixed inset-y-0 left-0 z-20">
      <div class="h-16 flex items-center gap-3 px-5 border-b"><div class="w-9 h-9 rounded-xl grad"></div><div><div class="font-black">Seller Center</div><div class="text-[11px] text-gray-500">Marty functional demo</div></div></div>
      <nav class="p-3 space-y-1 text-sm">
        <button data-route="overview" class="nav w-full text-left px-4 py-2 rounded-xl">🏠 Agent overview</button>
        <button data-route="inbox" class="nav w-full text-left px-4 py-2 rounded-xl">📬 Agent inbox <span id="navCount" class="ml-1 text-[10px] bg-spark px-1.5 rounded-full"></span></button>
        <button data-route="rules" class="nav w-full text-left px-4 py-2 rounded-xl">📜 Repricing rules <span class="text-[9px] bg-marty text-white rounded-full px-1.5">NEW</span></button>
        <button data-route="policy" class="nav w-full text-left px-4 py-2 rounded-xl">🛡️ Policy & guardrails</button>
        <button data-route="history" class="nav w-full text-left px-4 py-2 rounded-xl">📚 Action history</button>
      </nav>
      <div class="absolute bottom-4 left-4 right-4 card p-3 text-xs"><b>Mode:</b> <span id="modeLabel"></span><div class="flex gap-1 mt-2"><button data-mode="shadow" class="mode btn btns flex-1">Shadow</button><button data-mode="recommend" class="mode btn btns flex-1">Recommend</button><button data-mode="autopilot" class="mode btn btns flex-1">Auto</button></div></div>
    </aside>
    <main class="ml-64 flex-1 min-h-screen">
      <header class="h-16 bg-white border-b sticky top-0 z-10 flex items-center justify-between px-8"><div><b>Marty Pricing Agent</b><span class="text-gray-500 text-sm ml-2">AI actions, standing rules, human approval</span></div><button id="openChat" class="btn grad text-white">💬 Ask Marty</button></header>
      <section id="app" class="p-8 max-w-7xl mx-auto"></section>
    </main>
  </div>
  <div id="chat" class="hidden fixed right-5 bottom-5 w-[420px] max-w-[calc(100vw-40px)] h-[640px] bg-white rounded-3xl shadow-2xl border z-50 overflow-hidden flex flex-col">
    <div class="grad text-white p-4 flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-xl bg-white/20"></div><b>Marty</b></div><button id="closeChat" class="text-2xl">×</button></div>
    <div id="thread" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
    <form id="chatForm" class="border-t p-3 flex gap-2"><input id="chatInput" class="flex-1 border rounded-xl px-3 py-2" placeholder="Ask about pricing, rules, approvals..." /><button class="btn btnp">Send</button></form>
  </div>
  <div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 bg-ink text-white px-4 py-3 rounded-2xl shadow-lg text-sm z-[60]"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], money=n=>'$'+Math.round(n).toLocaleString();
const state={mode:'recommend',tab:'needs_approval',actions:[
 {id:'act-2014',item:'Garnier Fructis Sleek & Shine Shampoo',sku:'SKU-7462',tier:'low',type:'buybox_match',status:'needs_approval',price:7.98,rec:7.64,lift:1610,emoji:'💇',reason:'Small price gap is costing Buy Box on a high-traffic SKU.'},
 {id:'act-2002',item:'Davidoff Cool Water EDT',sku:'SKU-8821',tier:'low',type:'buybox_beat_by_cent',status:'needs_approval',price:29.99,rec:29.48,lift:2299,emoji:'🧴',reason:'Beat competitor by $0.01 while staying above margin floor.'},
 {id:'act-3007',item:'Intex Queen Air Mattress',sku:'SKU-1140',tier:'medium',type:'clearance_promo',status:'needs_approval',price:49.88,rec:39.90,lift:8420,emoji:'🛏️',reason:'Aged inventory with no sales in 365 days; 20% clearance recommended.'},
 {id:'BULK-REPRICER-TOP-1200',item:'Top 1,200 unenrolled SKUs',sku:'BULK',tier:'medium',type:'repricer_enrollment',status:'needs_approval',price:0,rec:0,lift:86400,emoji:'⚡',reason:'Only 1.28% of catalog is enrolled in Repricer. Highest leverage move today.'},
 {id:'act-4101',item:'Hero SKU: premium bundle',sku:'SKU-0001',tier:'high',type:'below_cost_drop',status:'blocked',price:99,rec:82,lift:0,emoji:'🛑',reason:'Blocked: recommendation would violate below-cost guardrail.'},
 {id:'act-1009',item:'Expired promo cleanup',sku:'SKU-5091',tier:'low',type:'revert_promo',status:'auto_executed',price:18.99,rec:21.99,lift:320,emoji:'✅',reason:'Expired promo safely reverted in Autopilot.'}],rules:[
 {id:'rule-101',name:'Move 12-month aged inventory with clearance promo',status:'active',tier:'medium',trigger:"No units sold for 365 days",scope:'Inventory-risk cohort',action:'Create 20% clearance promo',fired:87,lift:4280,units:210,ex:'Hero SKUs · New SKUs · Below cost · Blackouts'},
 {id:'rule-102',name:'Recover Buy Box on price-competitive cohort',status:'active',tier:'low',trigger:'Buy Box lost for 24 hours',scope:'Price-risk cohort',action:'Match competitor price within floor',fired:296,lift:18640,units:812,ex:'Hero SKUs · Below cost · MAP/MSRP'},
 {id:'rule-104',name:'Beat-by-1¢ on high-margin items losing Buy Box',status:'shadow',tier:'low',trigger:'Margin >35% and no Buy Box',scope:'All enrolled SKUs',action:'Beat competitor by $0.01',fired:141,lift:9120,units:297,ex:'Luxury brand exclusions · Below cost'},
 {id:'rule-105',name:'Auto-enroll new SKUs in Repricer after 30 days',status:'paused',tier:'medium',trigger:'SKU is 30 days old',scope:'New SKU cohort',action:'Enroll in Walmart Repricer',fired:12,lift:2410,units:58,ex:'Launch window · Hero SKUs'}],audit:[]};
state.audit=[{t:'12m ago',msg:'Auto-executed expired promo cleanup',kind:'executed'},{t:'2h ago',msg:'Blocked hero SKU below-cost drop',kind:'blocked'},{t:'3h ago',msg:'Rule fired: 20% clearance promo on 14 aged items',kind:'rule'}];
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),1800)}
function addAudit(msg,kind='seller'){state.audit.unshift({t:'just now',msg,kind});}
function tier(t){return `<span class="pill ${t}">${t.toUpperCase()}</span>`} function status(s){return `<span class="pill ${s==='active'?'low':s==='shadow'?'medium':'high'}">${s.toUpperCase()}</span>`}
function route(){return (location.hash||'#overview').slice(1)} function go(r){location.hash=r} window.onhashchange=render;
function shell(title,sub,body){return `<div class="mb-6"><div class="text-xs font-black text-marty uppercase tracking-wide">Pricing Agent</div><h1 class="text-3xl font-black">${title}</h1><p class="text-gray-500 mt-1">${sub}</p></div>${body}`}
function cardAction(a){return `<div class="card p-4 flex gap-4 items-start"><div class="text-3xl">${a.emoji}</div><div class="flex-1"><div class="flex gap-2 items-center mb-1">${tier(a.tier)}<span class="text-[10px] text-gray-500 font-bold">${a.type}</span></div><button data-route="action/${a.id}" class="text-left font-black hover:text-wmblue">${a.item}</button><div class="text-xs text-gray-500 mt-1">${a.reason}</div><div class="mt-2 text-sm"><b>${money(a.lift)}</b> projected 30-day GMV</div></div><div class="flex flex-col gap-2">${a.status==='needs_approval'?`<button data-approve="${a.id}" class="btn btnp">Approve</button><button data-reject="${a.id}" class="btn btns">Reject</button>`:a.status==='auto_executed'?`<button data-rollback="${a.id}" class="btn btns">Rollback</button>`:`<button data-route="action/${a.id}" class="btn btns">Review</button>`}</div></div>`}
function renderOverview(){let pending=state.actions.filter(a=>a.status==='needs_approval'), auto=state.actions.filter(a=>a.status==='auto_executed'); $('#app').innerHTML=shell('Agent overview','Marty found the highest-leverage pricing moves and recurring patterns.',`<div class="grid md:grid-cols-4 gap-4 mb-5"><div class="card p-5"><div class="text-xs text-gray-500 font-bold">Needs approval</div><div class="text-3xl font-black">${pending.length}</div></div><div class="card p-5"><div class="text-xs text-gray-500 font-bold">Projected GMV</div><div class="text-3xl font-black text-wmgreen">${money(pending.reduce((s,a)=>s+a.lift,0))}</div></div><div class="card p-5"><div class="text-xs text-gray-500 font-bold">Rules active</div><div class="text-3xl font-black">${state.rules.filter(r=>r.status==='active').length}</div></div><div class="card p-5"><div class="text-xs text-gray-500 font-bold">Auto-executed</div><div class="text-3xl font-black">${auto.length}</div></div></div><div class="card border-2 border-marty p-5 mb-5 flex items-center gap-5"><div class="text-5xl">⚡</div><div class="flex-1"><div class="text-xs font-black text-marty">#1 OPPORTUNITY</div><h2 class="font-black text-xl">Enroll top 1,200 SKUs in Walmart Repricer</h2><p class="text-sm text-gray-500">Only <b>1.28%</b> of catalog is enrolled. Enrolled SKUs show better PCS and Buy Box outcomes.</p></div><div class="text-right"><div class="text-3xl font-black text-wmgreen">+${money(86400)}</div><button data-route="action/BULK-REPRICER-TOP-1200" class="btn btnp mt-2">Review</button></div></div><div class="grid lg:grid-cols-2 gap-5"><div><h3 class="font-black mb-3">Needs your approval</h3><div class="space-y-3">${pending.slice(0,3).map(cardAction).join('')}</div></div><div><h3 class="font-black mb-3">Standing repricing rules</h3><div class="space-y-3">${state.rules.slice(0,3).map(ruleCard).join('')}</div><button data-route="rules/new" class="btn grad text-white mt-3">+ Create rule</button></div></div>`)}
function renderInbox(){let items=state.actions.filter(a=>state.tab==='all'||a.status===state.tab); $('#app').innerHTML=shell('Agent inbox','Approve, reject, inspect, or rollback pricing actions at scale.',`<div class="flex flex-wrap gap-2 mb-4">${['needs_approval','auto_executed','blocked','all'].map(t=>`<button data-tab="${t}" class="btn ${state.tab===t?'btnp':'btns'}">${t.replace('_',' ')}</button>`).join('')}<button data-bulk="approve" class="btn grad text-white ml-auto">Approve all visible</button></div><div class="space-y-3">${items.map(cardAction).join('')||'<div class="card p-10 text-center text-gray-500">Nothing here. Fancy that.</div>'}</div>`)}
function renderAction(id){let a=state.actions.find(x=>x.id===id); if(!a)return go('inbox'); $('#app').innerHTML=shell(a.item,'Action detail with reasoning, guardrails, and audit controls.',`<div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 space-y-4"><div class="card p-6"><div class="flex gap-3 mb-3">${tier(a.tier)}<span class="pill medium">${a.status.replace('_',' ').toUpperCase()}</span></div><div class="text-5xl mb-3">${a.emoji}</div><h2 class="text-2xl font-black">${a.item}</h2><p class="text-gray-500">${a.reason}</p><div class="grid grid-cols-3 gap-3 mt-5 text-center"><div class="bg-gray-50 rounded-xl p-3"><div class="text-xs text-gray-500">Current</div><b>${a.price?money(a.price):'—'}</b></div><div class="bg-gray-50 rounded-xl p-3"><div class="text-xs text-gray-500">Recommended</div><b>${a.rec?money(a.rec):'Enroll'}</b></div><div class="bg-gray-50 rounded-xl p-3"><div class="text-xs text-gray-500">GMV</div><b class="text-wmgreen">${money(a.lift)}</b></div></div></div><div class="card p-5"><h3 class="font-black mb-2">Guardrails checked</h3><ul class="text-sm space-y-2"><li>✅ Above cost floor</li><li>✅ MAP/MSRP respected</li><li>✅ Not a hero SKU</li><li>✅ Within max daily movement</li></ul></div></div><div class="card p-5 h-fit"><h3 class="font-black mb-3">Controls</h3>${a.status==='needs_approval'?`<button data-approve="${a.id}" class="btn btnp w-full mb-2">Approve action</button><button data-reject="${a.id}" class="btn btns w-full">Reject action</button>`:a.status==='auto_executed'?`<button data-rollback="${a.id}" class="btn btns w-full">Rollback</button>`:'<div class="text-sm text-gray-500">Blocked by policy. Review only.</div>'}<button data-route="inbox" class="btn btns w-full mt-2">Back to inbox</button></div></div>`)}
function ruleCard(r){return `<div class="card p-4 flex gap-4"><div class="text-3xl">📜</div><div class="flex-1"><div class="flex gap-2 mb-1">${tier(r.tier)}${status(r.status)}</div><button data-route="rule/${r.id}" class="text-left font-black hover:text-wmblue">${r.name}</button><p class="text-xs text-gray-500 mt-1">When ${r.trigger}, ${r.action}. Scope: ${r.scope}.</p><div class="text-xs mt-2"><b>${r.fired}</b> fired · <b class="text-wmgreen">${money(r.lift)}</b> 7d impact</div></div><button data-toggle-rule="${r.id}" class="btn btns">${r.status==='active'?'Pause':'Activate'}</button></div>`}
function renderRules(){ $('#app').innerHTML=shell('Repricing rules','Catalog-level WHEN→THEN automation that respects exclusion lists.',`<div class="card p-5 mb-5"><div class="flex items-center gap-4"><div class="text-4xl">✨</div><div class="flex-1"><b>Marty noticed a pattern</b><p class="text-sm text-gray-500">You approved 7 slow-mover markdowns. Want a standing rule?</p></div><button data-route="rules/new" class="btn grad text-white">Create rule</button></div></div><div class="space-y-3">${state.rules.map(ruleCard).join('')}</div>`)}
function renderRule(id){let r=state.rules.find(x=>x.id===id); if(!r)return go('rules'); $('#app').innerHTML=shell(r.name,'Rule detail: trigger, scope, action, exclusions, and performance.',`<div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 space-y-4"><div class="card p-5"><div class="flex gap-2 mb-3">${tier(r.tier)}${status(r.status)}</div><div class="grid md:grid-cols-3 gap-3"><div class="bg-gray-50 rounded-xl p-4"><div class="text-xs text-gray-500">WHEN</div><b>${r.trigger}</b></div><div class="bg-gray-50 rounded-xl p-4"><div class="text-xs text-gray-500">WHERE</div><b>${r.scope}</b></div><div class="bg-gray-50 rounded-xl p-4"><div class="text-xs text-gray-500">THEN</div><b>${r.action}</b></div></div></div><div class="card p-5"><h3 class="font-black mb-2">Exclusion list</h3><p class="text-sm">🛡️ ${r.ex}</p><p class="text-xs text-gray-500 mt-2">Rules also respect cost floor, max daily movement, MAP/MSRP, and blackout dates.</p></div></div><div class="card p-5 h-fit"><div class="text-xs text-gray-500">7-day performance</div><div class="text-3xl font-black text-wmgreen">${money(r.lift)}</div><div class="text-sm text-gray-500 mb-4">${r.fired} actions · ${r.units} units moved</div><button data-toggle-rule="${r.id}" class="btn btnp w-full mb-2">${r.status==='active'?'Pause':'Activate'} rule</button><button data-delete-rule="${r.id}" class="btn btns w-full">Delete rule</button></div></div>`)}
function renderNewRule(){ $('#app').innerHTML=shell('Create repricing rule','Start from a safe template. Shadow mode is the default because we are not goblins.',`<form id="ruleForm" class="card p-6 max-w-3xl space-y-4"><label class="block"><span class="text-xs font-bold text-gray-500">Rule name</span><input name="name" required class="w-full border rounded-xl px-3 py-2 mt-1" value="Move aged inventory with clearance promo"></label><div class="grid md:grid-cols-3 gap-3"><label><span class="text-xs font-bold text-gray-500">Trigger</span><select name="trigger" class="w-full border rounded-xl px-3 py-2 mt-1"><option>No units sold for 365 days</option><option>Buy Box lost for 24 hours</option><option>Margin >35% and no Buy Box</option></select></label><label><span class="text-xs font-bold text-gray-500">Scope</span><select name="scope" class="w-full border rounded-xl px-3 py-2 mt-1"><option>Inventory-risk cohort</option><option>Price-risk cohort</option><option>All enrolled SKUs</option></select></label><label><span class="text-xs font-bold text-gray-500">Action</span><select name="action" class="w-full border rounded-xl px-3 py-2 mt-1"><option>Create 20% clearance promo</option><option>Match competitor price within floor</option><option>Enroll in Walmart Repricer</option></select></label></div><div class="bg-gray-50 rounded-xl p-4 text-sm"><b>Always exclude:</b> hero SKUs, new SKUs, below-cost moves, blackout windows, MAP/MSRP violations.</div><div class="flex justify-end gap-2"><button type="button" data-route="rules" class="btn btns">Cancel</button><button class="btn grad text-white">Save in Shadow mode</button></div></form>`)}
function renderPolicy(){ $('#app').innerHTML=shell('Policy & guardrails','This is the trust substrate for one-time actions and standing rules.',`<div class="grid md:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-black">Pricing guardrails</h3><ul class="mt-3 text-sm space-y-2"><li>✅ Min margin: 12%</li><li>✅ Max daily movement: 8%</li><li>✅ Respect MAP/MSRP</li><li>✅ Protect hero SKUs</li></ul></div><div class="card p-5"><h3 class="font-black">Exclusion lists</h3><p class="text-sm text-gray-500 mt-2">Hero SKUs, new SKUs under 30 days, luxury brands, blackout windows, and specific SKU deny-lists are respected everywhere.</p></div></div>`)}
function renderHistory(){ $('#app').innerHTML=shell('Action history','Every action and rule mutation is auditable and reversible.',`<div class="card divide-y">${state.audit.map(e=>`<div class="p-4 flex gap-3"><div>${e.kind==='blocked'?'🛑':e.kind==='rule'?'📜':'✅'}</div><div class="flex-1"><b>${e.msg}</b><div class="text-xs text-gray-500">${e.t}</div></div><span class="text-xs font-bold text-gray-400">${e.kind}</span></div>`).join('')}</div>`)}
function render(){let r=route(); $$('.nav').forEach(n=>n.classList.toggle('active',r.split('/')[0]===(n.dataset.route||''))); $('#navCount').textContent=state.actions.filter(a=>a.status==='needs_approval').length; $('#modeLabel').textContent=state.mode; $$('.mode').forEach(b=>b.classList.toggle('btnp',b.dataset.mode===state.mode)); if(r==='overview')renderOverview(); else if(r==='inbox')renderInbox(); else if(r.startsWith('action/'))renderAction(r.split('/')[1]); else if(r==='rules')renderRules(); else if(r.startsWith('rule/'))renderRule(r.split('/')[1]); else if(r==='rules/new')renderNewRule(); else if(r==='policy')renderPolicy(); else if(r==='history')renderHistory(); else renderOverview();}
function approve(id){let a=state.actions.find(x=>x.id===id); if(!a)return; a.status='auto_executed'; addAudit(`Approved and executed: ${a.item}`); toast('Approved — action executed'); render()}
function reject(id){let a=state.actions.find(x=>x.id===id); if(!a)return; a.status='dismissed'; addAudit(`Rejected: ${a.item}`,'rejected'); toast('Rejected'); render()}
function rollback(id){let a=state.actions.find(x=>x.id===id); if(!a)return; a.status='rolled_back'; addAudit(`Rolled back: ${a.item}`,'rollback'); toast('Rolled back'); render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-route],[data-approve],[data-reject],[data-rollback],[data-tab],[data-bulk],[data-mode],[data-toggle-rule],[data-delete-rule]'); if(!t)return; if(t.dataset.route)go(t.dataset.route); if(t.dataset.approve)approve(t.dataset.approve); if(t.dataset.reject)reject(t.dataset.reject); if(t.dataset.rollback)rollback(t.dataset.rollback); if(t.dataset.tab){state.tab=t.dataset.tab;renderInbox()} if(t.dataset.bulk){state.actions.filter(a=>a.status==='needs_approval').forEach(a=>a.status='auto_executed');addAudit('Bulk approved all visible actions');toast('Bulk approved');render()} if(t.dataset.mode){state.mode=t.dataset.mode;addAudit(`Switched mode to ${state.mode}`);toast(`Mode: ${state.mode}`);render()} if(t.dataset.toggleRule){let r=state.rules.find(x=>x.id===t.dataset.toggleRule);r.status=r.status==='active'?'paused':'active';addAudit(`${r.status==='active'?'Activated':'Paused'} rule: ${r.name}`,'rule');toast('Rule updated');render()} if(t.dataset.deleteRule){state.rules=state.rules.filter(r=>r.id!==t.dataset.deleteRule);addAudit('Deleted repricing rule','rule');toast('Rule deleted');go('rules')}});
document.addEventListener('submit',e=>{if(e.target.id==='ruleForm'){e.preventDefault();let f=new FormData(e.target),r={id:'rule-'+(200+state.rules.length),name:f.get('name'),status:'shadow',tier:'medium',trigger:f.get('trigger'),scope:f.get('scope'),action:f.get('action'),fired:0,lift:0,units:0,ex:'Hero SKUs · New SKUs · Below cost · Blackouts'};state.rules.unshift(r);addAudit('Created rule in Shadow mode: '+r.name,'rule');toast('Rule created in Shadow mode');go('rule/'+r.id)}});
function bot(html){$('#thread').insertAdjacentHTML('beforeend',`<div class="toast bg-gray-50 rounded-2xl p-3">${html}</div>`);$('#thread').scrollTop=$('#thread').scrollHeight} function user(q){$('#thread').insertAdjacentHTML('beforeend',`<div class="toast text-right"><span class="inline-block bg-marty text-white rounded-2xl px-3 py-2">${q}</span></div>`)}
function answer(q){let s=q.toLowerCase(); if(s.includes('rule'))bot(`You have <b>${state.rules.length}</b> repricing rules. <button data-route="rules" class="btn btnp mt-2">Open rules</button> <button data-route="rules/new" class="btn btns mt-2">Create rule</button>`); else if(s.includes('approval')||s.includes('pending'))bot(`<b>${state.actions.filter(a=>a.status==='needs_approval').length}</b> actions need approval. <button data-route="inbox" class="btn btnp mt-2">Open inbox</button>`); else if(s.includes('buy box'))bot(`You have 1,834 small-gap Buy Box opportunities. I recommend matching/beat-by-1¢ within floor. <button data-route="inbox" class="btn btnp mt-2">Review actions</button>`); else if(s.includes('repricer'))bot(`Repricer enrollment is only <b>1.28%</b>. Top 1,200 SKUs can drive <b class="text-wmgreen">${money(86400)}</b>. <button data-route="action/BULK-REPRICER-TOP-1200" class="btn btnp mt-2">Review</button>`); else bot(`I can help with approvals, Buy Box, Repricer, or repricing rules. Try: <button data-route="rules/new" class="btn btns mt-2">Create aged inventory rule</button>`)}
$('#openChat').onclick=()=>{$('#chat').classList.remove('hidden'); if(!$('#thread').children.length)bot('Hi, I’m Marty. This demo is fully functional client-side — buttons mutate state, rules can be created, and actions can be approved.');}; $('#closeChat').onclick=()=>$('#chat').classList.add('hidden'); $('#chatForm').onsubmit=e=>{e.preventDefault();let q=$('#chatInput').value.trim(); if(!q)return; user(q); $('#chatInput').value=''; setTimeout(()=>answer(q),150)};
if(!location.hash)location.hash='overview'; render();
</script>
</body>
</html>
